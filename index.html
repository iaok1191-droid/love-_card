<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Proposal Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', 'Padauk', Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe6eb 0%, #ffd1dc 100%);
            overflow: hidden;
            position: relative;
        }

        /* Falling Hearts Animation Background */
        .heart-bg {
            position: absolute;
            top: -10%;
            font-size: 20px;
            animation: fall 4s linear infinite;
            opacity: 0.7;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Card Layout */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            text-align: center;
            width: 90%;
            max-width: 340px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 2px solid #ffffff;
        }

        .img-container {
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 16px;
            background-color: #fff0f3;
        }

        .img-container img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .text-message {
            font-size: 19px;
            font-weight: bold;
            color: #d81b60;
            margin-bottom: 25px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        /* Buttons Setup */
        .btn-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            position: relative;
            min-height: 110px;
        }

        button {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .btn-yes {
            background-color: #10b981;
            color: white;
            z-index: 2;
        }

        .btn-yes:active {
            transform: scale(0.98);
        }

        .btn-no {
            background-color: #ef4444;
            color: white;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="img-container">
            <img id="card-img" src="https://media.giphy.com/media/cLS1AC1E8K40A3y5yL/giphy.gif" alt="cute gif">
        </div>
        <div id="card-text" class="text-message">ပြန်ချစ်ပါလား 💖</div>
        
        <div class="btn-container">
            <button id="yes-btn" class="btn-yes" onclick="handleYes()">YES ❤️</button>
            <button id="no-btn" class="btn-no" onclick="handleNo()">မချစ်ဘူး</button>
        </div>
    </div>

    <script>
        const steps = [
            {
                text: "ပြန်ချစ်ပါလား 💖",
                img: "https://media.giphy.com/media/cLS1AC1E8K40A3y5yL/giphy.gif"
            },
            {
                text: "မငြင်းလိုက်ပါနဲ့ 🥺",
                img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eXp2aHVpY3BwOHgzYmk4eXJhbDV2eGN0ZG9xZDVubG1mOGszNSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L95W4wv8nnb9K/giphy.gif"
            },
            {
                text: "တကယ်ချစ်တာပါ လက်ခံပါနော် 💔",
                img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExN3J1bWZ2ZzMzaWkyb3ZzY3cxcDFtb3B4bWNkMzk3YXByNGNidzA2NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/d22UJ48j63Th21644A/giphy.gif"
            }
        ];

        let currentStep = 0;
        let yesScale = 1;

        function handleNo() {
            currentStep++;
            if (currentStep >= steps.length) {
                currentStep = steps.length - 1;
            }

            document.getElementById('card-text').innerText = steps[currentStep].text;
            document.getElementById('card-img').src = steps[currentStep].img;

            yesScale += 0.35;
            const yesBtn = document.getElementById('yes-btn');
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function handleYes() {
            document.getElementById('card-text').innerText = "အရမ်းချစ်တယ် ရည်းစားလေး 💖🥰";
            document.getElementById('card-img').src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaTJ3ZWZxeXU4cXJjcjE0YzAxeHgyOWJvbnBsbGNxMmFtd3J4cmZsayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif";
            
            document.querySelector('.btn-container').style.display = 'none';

            for(let i = 0; i < 40; i++) {
                createHeart();
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            
            const heartIcons = ['💖', '❤️', '💕', '🌸', '✨'];
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
